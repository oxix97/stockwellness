spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/test/batch-metadata.sql
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  docker:
    compose:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092

resilience4j:
  ratelimiter:
    instances:
      kisRateLimiter:
        timeout-duration: 0ms
        limit-for-period: 1000
        limit-refresh-period: 1s

management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
