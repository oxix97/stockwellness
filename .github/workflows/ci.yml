name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main, develop ]        # main 및 develop 대상 PR 시 실행

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify deployment workflows
        run: ruby .github/tests/main_cd_test.rb

      - name: Build & Test (all modules)
        run: ./gradlew build --no-daemon

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/build/reports/jacoco/test/html
            **/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 7

  deploy-api:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-api.yaml
    secrets: inherit

  deploy-batch:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-batch.yaml
    secrets: inherit
